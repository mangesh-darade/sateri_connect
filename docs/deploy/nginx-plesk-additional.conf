# Plesk → Domain → Apache & nginx → Additional nginx directives
# Use when DocumentRoot is the project root (not public/).
#
# Replace ROOT with your absolute path, e.g.:
# /var/www/vhosts/elintpos.in/Pos_Merchants/Devpos/android_testing

# --- Deny sensitive paths ---
location ~* /\.(env|git) {
    deny all;
    return 404;
}

location ~* ^/(app|writable|vendor|tests|docs|tools)(/|$) {
    deny all;
    return 404;
}

location ~* \.(sql|bak)$ {
    deny all;
    return 404;
}

location = /composer.json { deny all; return 404; }
location = /composer.lock { deny all; return 404; }
location = /spark { deny all; return 404; }

# --- Static assets from public/ ---
location /assets/ {
    alias ROOT/public/assets/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public";
}

location /uploads/ {
    alias ROOT/public/uploads/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public";

    location ~* \.(php|phtml|phar)$ {
        deny all;
        return 404;
    }
}

location = /favicon.ico {
    alias ROOT/public/favicon.ico;
    access_log off;
    log_not_found off;
}

location = /robots.txt {
    alias ROOT/public/robots.txt;
    access_log off;
    log_not_found off;
}
